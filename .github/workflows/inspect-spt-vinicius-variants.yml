name: inspect-spt-vinicius-variants
on:
  push:
    paths:
      - '.github/workflows/inspect-spt-vinicius-variants.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck current source
        run: |
          npm ci
          npx tsc --noEmit --pretty false || true
