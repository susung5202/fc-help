name: One-time responsive squad maker

on:
  push:
    paths:
      - .github/workflows/one-time-responsive-squad.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply responsive squad patch
        run: python3 scripts/patch-squad-responsive.py
      - name: Commit responsive squad maker
        run: |
          rm -f .github/workflows/one-time-responsive-squad.yml scripts/patch-squad-responsive.py
          git config user.name "susung5202"
          git config user.email "74191151+susung5202@users.noreply.github.com"
          git add components/SquadMaker.tsx components/SquadPlayerCard.tsx .github/workflows/one-time-responsive-squad.yml scripts/patch-squad-responsive.py
          git commit -m "style: make squad maker responsive on mobile"
          git push
