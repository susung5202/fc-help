name: One-time squad team color fixes

on:
  push:
    paths:
      - .github/workflows/one-time-teamcolor-image-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install html2canvas@1.4.1 --save
      - run: python3 scripts/patch-teamcolor-image-fix.py
      - run: npx tsc --noEmit
      - name: Commit fixes
        run: |
          rm -f .github/workflows/one-time-teamcolor-image-fix.yml scripts/patch-teamcolor-image-fix.py
          git config user.name "susung5202"
          git config user.email "74191151+susung5202@users.noreply.github.com"
          git add package.json package-lock.json components/SquadMaker.tsx components/SquadPlayerCard.tsx app/api/squad/team-color/route.ts .github/workflows/one-time-teamcolor-image-fix.yml scripts/patch-teamcolor-image-fix.py
          git commit -m "fix: sync squad OVR relationship colors and image export"
          git push
