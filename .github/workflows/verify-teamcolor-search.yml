name: verify-teamcolor-search
on:
  push:
    paths:
      - '.github/workflows/verify-teamcolor-search.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify teamcolor search and players
        run: |
          python - <<'PY'
          import requests
          base='https://fchelp.xyz/api/squad/team-color-search'
          r=requests.get(base,params={'q':'레알마드리드'},timeout=90)
          print('SEARCH_STATUS',r.status_code)
          data=r.json()
          colors=data.get('teamColors',[])
          print('COLOR_COUNT',len(colors))
          for c in colors[:80]: print('COLOR',c)
          expected=['22-23 레알 마드리드','23-24 레알 마드리드','로스 블랑코스 듀오','갈락티코 1기']
          names={c.get('name') for c in colors}
          for name in expected: print('HAS',name,name in names)
          r2=requests.get(base,params={'teamColorId':'40417'},timeout=90)
          print('PLAYERS_STATUS',r2.status_code)
          d2=r2.json(); players=d2.get('players',[])
          print('PLAYER_COUNT',len(players))
          print('PLAYERS',[p.get('name') for p in players[:40]])
          assert r.status_code==200 and r2.status_code==200
          assert '22-23 레알 마드리드' in names
          assert len(players)>=20
          PY
