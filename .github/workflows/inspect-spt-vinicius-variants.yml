name: inspect-spt-vinicius-variants
on:
  push:
    paths:
      - '.github/workflows/inspect-spt-vinicius-variants.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official mobile position markup
        run: |
          python - <<'PY'
          import requests,re
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'})
          for spid in [834238794,848238794,867238794]:
            h=s.get('https://m.fconline.nexon.com/datacenter/playerinfo',params={'spid':spid},timeout=90).text
            print('\nSPID',spid,'LEN',len(h))
            for pat in ['position','LW','GK','ovr','ability']:
              m=re.search(pat,h,re.I)
              if m:
                a=max(0,m.start()-500); b=min(len(h),m.start()+1200)
                print('PAT',pat, re.sub(r'\\s+',' ',h[a:b])[:1800])
          PY
