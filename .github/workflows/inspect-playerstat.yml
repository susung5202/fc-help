name: inspect-playerstat
on:
  push:
    paths:
      - '.github/workflows/inspect-playerstat.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Real Madrid related teamcolors
        run: |
          python - <<'PY'
          import requests,re,html as h
          headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ko-KR,ko;q=0.9'}
          s=requests.Session(); s.headers.update(headers)
          page=s.get('https://fconline.nexon.com/DataCenter',timeout=30).text
          anchors=[]
          pat=re.compile(r'<a\b([^>]*)class=["\']([^"\']*tcboosts_[^"\']*)["\']([^>]*)>([\s\S]*?)</a>',re.I)
          for m in pat.finditer(page):
            attrs=m.group(1)+' '+m.group(3); classes=m.group(2)
            no=re.search(r'data-no=["\'](\d+)["\']',attrs,re.I)
            name=h.unescape(re.sub(r'<[^>]+>',' ',m.group(4)))
            name=re.sub(r'\s+',' ',name).strip()
            if no and ('레알' in name or '로스 블랑코스' in name or '갈락티코' in name):
              anchors.append((no.group(1),classes,name))
          print('MATCHES')
          for x in anchors: print(x)
          exact=next((x for x in anchors if x[2]=='레알 마드리드'),None)
          print('EXACT',exact)
          ids=[]
          if exact: ids.append(exact[0])
          ids += [x[0] for x in anchors if x[2] in ('22-23 레알 마드리드','로스 블랑코스 공격 듀오','갈락티코 1기')]
          for tcid in dict.fromkeys(ids):
            r=s.get('https://fconline.nexon.com/datacenter/TeamColorDetail',params={'teamcolorid':tcid},timeout=30)
            text=r.text
            plain=h.unescape(re.sub(r'<[^>]+>',' ',text)); plain=re.sub(r'\s+',' ',plain).strip()
            print('\nDETAIL',tcid,'STATUS',r.status_code,'LEN',len(text))
            print('TEXT',plain[:4000])
            print('IDS/NAMES snippets')
            for needle in ['레알','로스 블랑코스','갈락티코','선수']:
              i=plain.find(needle)
              if i>=0: print(plain[max(0,i-500):i+1800])
          PY
