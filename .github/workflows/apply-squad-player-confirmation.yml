name: Apply squad player confirmation

on:
  push:
    paths:
      - '.github/scripts/add-squad-player-confirmation.py'
      - '.github/workflows/apply-squad-player-confirmation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python3 .github/scripts/add-squad-player-confirmation.py
      - run: npx eslint components/SquadMaker.tsx
      - name: Commit changes
        run: |
          git config user.name "susung5202"
          git config user.email "74191151+susung5202@users.noreply.github.com"
          git add components/SquadMaker.tsx
          git rm .github/scripts/add-squad-player-confirmation.py .github/workflows/apply-squad-player-confirmation.yml
          git commit -m "feat: confirm squad player before adding"
          git push
