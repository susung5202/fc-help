name: Apply team color OVR fix
on:
  push:
    paths:
      - .github/workflows/inspect-teamcolor-ovr.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 .github/scripts/fix-teamcolor-ovr.py
      - run: npx eslint lib/fconline/positionOvr.ts app/api/squad/team-color/route.ts
      - name: Commit fix
        run: |
          rm .github/workflows/inspect-teamcolor-ovr.yml
          rm .github/scripts/fix-teamcolor-ovr.py
          git config user.name "susung5202"
          git config user.email "74191151+susung5202@users.noreply.github.com"
          git add lib/fconline/positionOvr.ts app/api/squad/team-color/route.ts .github/workflows/inspect-teamcolor-ovr.yml .github/scripts/fix-teamcolor-ovr.py
          git commit -m "fix: apply team color bonuses to squad OVR"
          git push
