name: Patch account settings links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch mypage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/mypage/page.tsx')
          s = p.read_text()

          s = s.replace(
            '''                <button type="button" onClick={openProfileEditor} className="rounded-lg bg-white/10 px-3 py-2 text-xs font-black text-gray-100 transition hover:bg-white/15">\n                  프로필 편집\n                </button>\n                <button type="button" onClick={() => void logout()}''',
            '''                <button type="button" onClick={openProfileEditor} className="rounded-lg bg-white/10 px-3 py-2 text-xs font-black text-gray-100 transition hover:bg-white/15">\n                  프로필 편집\n                </button>\n                <Link href="/mypage/settings" className="rounded-lg border border-lime-300/15 bg-lime-300/[0.04] px-3 py-2 text-xs font-black text-lime-200 transition hover:bg-lime-300/[0.08]">\n                  계정 설정\n                </Link>\n                <button type="button" onClick={() => void logout()}''',
            1,
          )

          s = s.replace(
            '''              {profile.fconline_nickname && (\n                <button type="button" onClick={openProfileEditor} className="text-xs font-black text-lime-300">연동 수정 →</button>\n              )}''',
            '''              {profile.fconline_nickname && (\n                <Link href="/mypage/settings" className="text-xs font-black text-lime-300">연동 수정 →</Link>\n              )}''',
            1,
          )

          s = s.replace(
            '''              <button type="button" onClick={openProfileEditor} className="mt-4 rounded-xl bg-lime-300 px-4 py-2.5 text-xs font-black text-black transition hover:bg-lime-200">\n                FC Online 닉네임 연결\n              </button>''',
            '''              <Link href="/mypage/settings" className="mt-4 inline-block rounded-xl bg-lime-300 px-4 py-2.5 text-xs font-black text-black transition hover:bg-lime-200">\n                FC Online 닉네임 연결\n              </Link>''',
            1,
          )

          s = s.replace(
            '''    const displayName = displayNameInput.trim();\n    const bio = bioInput.trim();\n    const fcNickname = fcNicknameInput.trim();''',
            '''    const displayName = profile.display_name;\n    const bio = bioInput.trim();\n    const fcNickname = profile.fconline_nickname ?? "";''',
            1,
          )

          s = s.replace(
            '''            <label className="mt-6 block text-xs font-bold text-gray-400">FC Help 아이디</label>''',
            '''            <label className="mt-6 block text-xs font-bold text-gray-400">공개 프로필 아이디</label>''',
            1,
          )
          s = s.replace(
            '''            <p className="mt-1 text-[10px] text-gray-600">영문 소문자, 숫자, 밑줄(_) · 3~20자</p>\n\n            <label className="mt-4 block text-xs font-bold text-gray-400">닉네임</label>\n            <input value={displayNameInput} onChange={(event) => setDisplayNameInput(event.target.value)} maxLength={20} className="mt-2 w-full rounded-xl border border-white/10 bg-[#0f1115] px-4 py-3 text-sm outline-none focus:border-lime-300/40" />''',
            '''            <p className="mt-1 text-[10px] text-gray-600">영문 소문자, 숫자, 밑줄(_) · 3~20자 · 로그인 아이디와 별개</p>\n\n            <div className="mt-4 rounded-xl border border-lime-300/10 bg-lime-300/[0.03] px-3 py-3 text-xs text-gray-400">\n              사이트 닉네임은 FC Online 닉네임과 동일하게 사용합니다. 변경은 <Link href="/mypage/settings" className="font-black text-lime-300">계정 설정</Link>에서 할 수 있습니다.\n            </div>''',
            1,
          )

          old_fc = '''            <div className="mt-5 rounded-2xl border border-lime-300/15 bg-lime-300/[0.04] p-4">\n              <p className="text-xs font-black text-lime-300">FC Online 연동</p>\n              <label className="mt-3 block text-[10px] font-bold text-gray-500">구단주 닉네임</label>\n              <input value={fcNicknameInput} onChange={(event) => setFcNicknameInput(event.target.value)} maxLength={30} placeholder="FC Online 닉네임" className="mt-2 w-full rounded-xl border border-white/10 bg-[#0f1115] px-4 py-3 text-sm outline-none focus:border-lime-300/40" />\n              <p className="mt-2 text-[10px] leading-5 text-gray-600">저장하면 NEXON Open API에서 구단주 정보와 1대1 공식경기 등급을 조회합니다. 빈칸으로 저장하면 연동이 해제됩니다.</p>\n            </div>\n\n'''
          s = s.replace(old_fc, '', 1)

          p.write_text(s)
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/mypage/page.tsx
          git commit -m "add account settings entry points"
          git push
