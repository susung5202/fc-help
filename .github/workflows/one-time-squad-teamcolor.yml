name: One-time squad team color UI

on:
  push:
    paths:
      - .github/workflows/one-time-squad-teamcolor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply squad team color UI patch
        run: python3 scripts/patch-squad-teamcolor-ui.py
      - name: Commit squad team color UI
        run: |
          rm -f .github/workflows/one-time-squad-teamcolor.yml scripts/patch-squad-teamcolor-ui.py
          git config user.name "susung5202"
          git config user.email "74191151+susung5202@users.noreply.github.com"
          git add components/SquadMaker.tsx components/SquadPlayerCard.tsx .github/workflows/one-time-squad-teamcolor.yml scripts/patch-squad-teamcolor-ui.py
          git commit -m "feat: apply adaptation and team colors to squad maker"
          git push
