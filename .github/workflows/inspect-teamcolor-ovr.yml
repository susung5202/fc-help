name: Inspect team color OVR parsing
on:
  push:
    paths:
      - .github/workflows/inspect-teamcolor-ovr.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect Real Madrid team color page
        run: |
          python3 - <<'PY'
          import re, urllib.parse, urllib.request, html as htmllib
          name='레알 마드리드'
          url='https://fconline.nexon.com/datacenter/teamcolor?strTeamColorName='+urllib.parse.quote(name)
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ko-KR,ko;q=0.9'})
          raw=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','ignore')
          text=htmllib.unescape(re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',raw)))
          idxs=[m.start() for m in re.finditer(re.escape(name),text)]
          print('indexes',idxs,'count',len(idxs))
          for idx in idxs:
            print('CTX',text[max(0,idx-120):idx+420])
          print('stages',re.findall(r'[1-4]단계',text)[:40])
          print('overall',re.findall(r'전체 능력치\s*\+\d+',text)[:40])
          PY
