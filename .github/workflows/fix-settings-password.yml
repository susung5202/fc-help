name: Fix account settings password field

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Supabase password field
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/mypage/settings/page.tsx')
          s = p.read_text()
          old = '''    const { error: updateError } = await supabase.auth.updateUser({\n      password: newPassword,\n      currentPassword,\n    });'''
          new = '''    const { error: updateError } = await supabase.auth.updateUser({\n      password: newPassword,\n      current_password: currentPassword,\n    });'''
          if old not in s:
              raise SystemExit('password update block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/mypage/settings/page.tsx
          git commit -m "fix account settings password update"
          git push
