name: inspect-playerstat
on:
  push:
    paths:
      - '.github/workflows/inspect-playerstat.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official teamcolor search results
        run: |
          python - <<'PY'
          import requests,re,html as h
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'ko-KR,ko;q=0.9'})
          for q in ['레알 마드리드','레알','바이에른 뮌헨']:
            r=s.get('https://fconline.nexon.com/datacenter/teamcolor',params={'strTeamColorName':q},timeout=30)
            text=r.text
            plain=h.unescape(re.sub(r'<[^>]+>',' ',text)); plain=re.sub(r'\s+',' ',plain).strip()
            print('\nQUERY',q,'STATUS',r.status_code,'LEN',len(text))
            names=[]
            # list strings around known team-color detail click ids/names
            for m in re.finditer(r'(?:teamcolorid|data-no)[^0-9]{0,20}(\d+)',text,re.I):
              snippet=text[max(0,m.start()-600):m.start()+1000]
              txt=h.unescape(re.sub(r'<[^>]+>',' ',snippet)); txt=re.sub(r'\s+',' ',txt).strip()
              if txt not in names: names.append(txt)
            for x in names[:80]: print('ROW',x[:500])
            for needle in ['로스 블랑코스','갈락티코','22-23 레알 마드리드','23-24 레알 마드리드']:
              print('HAS',needle,needle in plain)
          PY
