name: inspect-spt-vinicius-variants
on:
  push:
    paths:
      - '.github/workflows/inspect-spt-vinicius-variants.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect remaining GK variant
        run: |
          python - <<'PY'
          import requests
          d=requests.get(
            'https://fchelp.xyz/api/squad/variants',
            params={'spid':834238794,'_v':'c17ca40b'},
            timeout=120,
            headers={'User-Agent':'Mozilla/5.0'}
          ).json()
          vv=d.get('variants',[])
          print('GK_VARIANTS',[(x.get('id'),x.get('name'),x.get('seasonName'),x.get('position'),x.get('ovr')) for x in vv if x.get('position')=='GK'])
          PY
