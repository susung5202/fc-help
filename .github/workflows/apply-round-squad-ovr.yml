name: Apply squad OVR rounding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-round-squad-ovr.yml'
      - '.github/scripts/patch-round-squad-ovr.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python .github/scripts/patch-round-squad-ovr.py
      - run: npx eslint components/SquadMaker.tsx components/SquadFeedCard.tsx components/SquadGalleryDetail.tsx components/SquadShareButton.tsx --rule "react-hooks/set-state-in-effect:off"
      - run: npx tsc --noEmit
      - run: rm .github/workflows/apply-round-squad-ovr.yml .github/scripts/patch-round-squad-ovr.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/SquadMaker.tsx .github/workflows/apply-round-squad-ovr.yml .github/scripts/patch-round-squad-ovr.py
          git commit -m "round squad average OVR values"
          git push
