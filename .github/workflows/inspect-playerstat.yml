name: inspect-playerstat
on:
  push:
    paths:
      - '.github/workflows/inspect-playerstat.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect FC Online playerstat AJAX
        run: |
          python - <<'PY'
          import requests,re,urllib.parse
          headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ko-KR,ko;q=0.9'}
          base='https://fconline.nexon.com/DataCenter/PlayerStat'
          r=requests.get(base,headers=headers,timeout=30)
          html=r.text
          print('PAGE',r.status_code,len(html))
          needles=['GetPlayerStatList','SetSearchForStat','SetTeamColorId']
          for needle in needles:
            print('\nINLINE',needle)
            for m in list(re.finditer(needle,html,re.I))[:10]:
              print(html[max(0,m.start()-1200):m.start()+2500])
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          print('\nSCRIPTS',len(scripts))
          for src in scripts:
            url=urllib.parse.urljoin(base,src)
            try:
              t=requests.get(url,headers=headers,timeout=30).text
            except Exception:
              continue
            if any(n in t for n in needles):
              print('\nSCRIPT',url,'LEN',len(t))
              for needle in needles:
                for m in list(re.finditer(needle,t,re.I))[:5]:
                  print('\nFOUND',needle,'AT',m.start())
                  print(t[max(0,m.start()-1800):m.start()+5000])
          PY
