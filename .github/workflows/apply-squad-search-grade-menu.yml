name: Apply squad search grade menu
on:
  push:
    paths:
      - .github/workflows/apply-squad-search-grade-menu.yml
      - .github/scripts/patch-squad-search-grade-menu.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 .github/scripts/patch-squad-search-grade-menu.py
      - run: npx eslint components/SquadMaker.tsx --rule "react-hooks/set-state-in-effect:off"
      - name: Commit patch
        run: |
          rm .github/workflows/apply-squad-search-grade-menu.yml
          rm .github/scripts/patch-squad-search-grade-menu.py
          git config user.name "susung5202"
          git config user.email "74191151+susung5202@users.noreply.github.com"
          git add components/SquadMaker.tsx .github/workflows/apply-squad-search-grade-menu.yml .github/scripts/patch-squad-search-grade-menu.py
          git commit -m "feat: improve squad search enhancement selector"
          git push
