name: fix-teamcolor-related-v2
on:
  push:
    paths:
      - '.github/workflows/fix-teamcolor-related-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch related teamcolor discovery
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          path = Path('app/api/squad/team-color-search/route.ts')
          text = path.read_text()
          start = text.index('async function discoverRelatedTeamColors(')
          end = text.index('function directMatchScore', start)
          encoded = ''
          replacement = base64.b64decode(encoded).decode()
          path.write_text(text[:start] + replacement + text[end:])
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app/api/squad/team-color-search/route.ts
          git commit -m "tighten related teamcolor matching"
          git push
