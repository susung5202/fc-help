name: inspect-teamcolor-national
on:
  push:
    paths:
      - '.github/workflows/inspect-teamcolor-national.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect teamcolor classes and season meta
        run: |
          python - <<'PY'
          import requests,re,html,json
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'ko-KR,ko;q=0.9'})
          page=s.get('https://fconline.nexon.com/DataCenter',timeout=30).text
          print('HTML',len(page))
          for target in ['프랑스','벨기에','대한민국']:
            print('\nTARGET',target)
            found=0
            for m in re.finditer(r'<a\b([^>]*)>([\s\S]*?)</a>',page,re.I):
              txt=html.unescape(re.sub(r'<[^>]+>',' ',m.group(2)))
              txt=re.sub(r'\s+',' ',txt).strip()
              if target in txt:
                attrs=m.group(1)
                print('NAME',txt[:160],'ATTRS',attrs[:700])
                found+=1
                if found>=20: break
            print('COUNT>=',found)
          for url in [
            'https://open.api.nexon.com/static/fconline/meta/seasonid.json',
            'https://open.api.nexon.com/static/fconline/meta/spid.json']:
            r=s.get(url,timeout=30)
            print('\nMETA',url,r.status_code,len(r.content),r.text[:500])
          PY
