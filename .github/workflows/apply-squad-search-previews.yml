name: Apply squad search previews
on:
  push:
    paths:
      - .github/workflows/apply-squad-search-previews.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 .github/scripts/add-squad-search-previews.py
      - name: Lint SquadMaker
        run: 'npx eslint components/SquadMaker.tsx --rule "react-hooks/set-state-in-effect: off"'
      - name: Commit changes
        run: |
          rm .github/workflows/apply-squad-search-previews.yml
          rm .github/scripts/add-squad-search-previews.py
          git config user.name "susung5202"
          git config user.email "74191151+susung5202@users.noreply.github.com"
          git add components/SquadMaker.tsx .github/workflows/apply-squad-search-previews.yml .github/scripts/add-squad-search-previews.py
          git commit -m "feat: show artwork and price in squad search"
          git push
