name: One-time fix empty squad slot click

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-fix-empty-squad-slot.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch empty squad slots
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("components/SquadMaker.tsx")
          source = path.read_text(encoding="utf-8")

          old_hitbox = '''    >\n      {!occupied && <span className="text-lg font-light text-white/90 sm:text-2xl">+</span>}\n    </div>'''
          new_hitbox = '''    >\n      {dragActive && !occupied && (\n        <span className="text-lg font-light text-white/65 sm:text-2xl">+</span>\n      )}\n    </div>'''
          if old_hitbox not in source:
              raise SystemExit("PositionHitbox marker not found")
          source = source.replace(old_hitbox, new_hitbox, 1)

          old_class = '''      className={`group absolute z-10 flex -translate-x-1/2 -translate-y-1/2 flex-col items-center select-none transition ${\n        dragging\n          ? "z-40 scale-105 cursor-grabbing opacity-90"\n          : dropTarget\n            ? "z-30 scale-105"\n            : active\n              ? "scale-105"\n              : "hover:scale-105"\n      } ${player ? "cursor-grab" : "cursor-pointer"}`}'''
          new_class = '''      className={`group absolute flex -translate-x-1/2 -translate-y-1/2 flex-col items-center select-none transition ${\n        dragging\n          ? "z-40 scale-105 cursor-grabbing opacity-90"\n          : dropTarget\n            ? "z-30 scale-105"\n            : active\n              ? "z-30 scale-105"\n              : player\n                ? "z-20 hover:scale-105"\n                : "z-30 hover:scale-105"\n      } ${player ? "cursor-grab" : "cursor-pointer"}`}'''
          if old_class not in source:
              raise SystemExit("SquadSlotButton class marker not found")
          source = source.replace(old_class, new_class, 1)

          old_empty = '''      ) : (\n        <span\n          className="block h-[clamp(48px,10%,76px)] w-[clamp(48px,15%,86px)]"\n          aria-hidden="true"\n        />\n      )}'''
          new_empty = '''      ) : (\n        <div\n          className={`flex h-[58px] w-[72px] items-center justify-center rounded-xl border bg-black/40 shadow-lg backdrop-blur-sm transition sm:h-[70px] sm:w-[88px] ${\n            active\n              ? "border-lime-300/80 bg-lime-300/10 ring-2 ring-lime-300/30"\n              : dropTarget\n                ? "border-lime-300/80 bg-lime-300/10"\n                : "border-white/20 hover:border-white/40 hover:bg-black/50"\n          }`}\n        >\n          <span className="text-3xl font-light leading-none text-white/90 sm:text-4xl">+</span>\n        </div>\n      )}'''
          if old_empty not in source:
              raise SystemExit("Empty slot marker not found")
          source = source.replace(old_empty, new_empty, 1)

          path.write_text(source, encoding="utf-8")
          PY

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/SquadMaker.tsx
          git rm .github/workflows/one-time-fix-empty-squad-slot.yml
          git commit -m "fix: make empty squad positions tappable"
          git push origin HEAD:main
