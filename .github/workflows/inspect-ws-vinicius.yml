name: inspect-ws-vinicius
on:
  push:
    paths:
      - '.github/workflows/inspect-ws-vinicius.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Verify WS Vinicius direct search
        run: |
          python - <<'PY'
          import requests
          base='https://fchelp.xyz/api/squad/team-color-search'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0'})
          r=s.get(base,params={'teamColorId':1018,'page':1,'target':'field','cardQuery':'WS 비니시우스'},timeout=90)
          print('STATUS',r.status_code)
          d=r.json()
          print('TOTAL',d.get('total'),'PAGES',d.get('totalPages'))
          print('RESULTS',[(x.get('id'),x.get('name'),x.get('seasonName')) for x in d.get('players',[])])
          assert any(x.get('id')==848238794 for x in d.get('players',[]))
          PY
