name: One-time squad export and emblem fix

on:
  push:
    paths:
      - .github/workflows/one-time-squad-export-emblem.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install screenshot renderer
        run: |
          npm uninstall html2canvas
          npm install html2canvas-pro@2.4.3 --save
      - name: Apply patch
        run: python3 scripts/patch-squad-export-emblem.py
      - name: Lint changed squad files
        run: >-
          npx eslint components/SquadMaker.tsx app/api/squad/team-color/route.ts
          --rule '{"react-hooks/set-state-in-effect":"off"}'
      - name: Commit fixes
        run: |
          rm -f .github/workflows/one-time-squad-export-emblem.yml scripts/patch-squad-export-emblem.py
          git config user.name "susung5202"
          git config user.email "74191151+susung5202@users.noreply.github.com"
          git add package.json package-lock.json components/SquadMaker.tsx app/api/squad/team-color/route.ts .github/workflows/one-time-squad-export-emblem.yml scripts/patch-squad-export-emblem.py
          git commit -m "fix: use official enhancement emblem and reliable squad export"
          git push
