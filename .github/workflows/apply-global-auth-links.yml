name: Apply global auth links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-global-auth-links.yml'
      - '.github/scripts/patch-global-auth-links.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python .github/scripts/patch-global-auth-links.py
      - run: npx tsc --noEmit
      - run: npm run build
      - run: rm .github/workflows/apply-global-auth-links.yml .github/scripts/patch-global-auth-links.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app .github/workflows/apply-global-auth-links.yml .github/scripts/patch-global-auth-links.py
          git commit -m "use persistent account state across FC Help pages"
          git push
