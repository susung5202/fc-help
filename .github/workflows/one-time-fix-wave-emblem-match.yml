name: Apply enhancement emblem match

on: push

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch enhancement matcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/api/squad/team-color/route.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '  const waveName = Object.keys(ENHANCEMENT_EMBLEM_MAP).find((key) => name.includes(key));\n  return waveName ? ENHANCEMENT_EMBLEM_MAP[waveName as keyof typeof ENHANCEMENT_EMBLEM_MAP] : null;',
              '  const waveName = name.replace(/^Lv\\.\\d+\\s*/, "").trim();\n  return ENHANCEMENT_EMBLEM_MAP[waveName as keyof typeof ENHANCEMENT_EMBLEM_MAP] ?? null;',
              1,
          )
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix and cleanup
        run: |
          rm .github/workflows/one-time-fix-wave-emblem-match.yml
          git config user.name "susung5202"
          git config user.email "74191151+susung5202@users.noreply.github.com"
          git add app/api/squad/team-color/route.ts .github/workflows/one-time-fix-wave-emblem-match.yml
          git commit -m "fix: match enhancement wave emblems exactly"
          git push
