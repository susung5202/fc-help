name: inspect-playerstat
on:
  push:
    paths:
      - '.github/workflows/inspect-playerstat.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect general player list teamcolor filter
        run: |
          python - <<'PY'
          import requests,re,html as h,urllib.parse
          headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ko-KR,ko;q=0.9'}
          s=requests.Session(); s.headers.update(headers)
          base='https://fconline.nexon.com/DataCenter'
          page=s.get(base,timeout=30).text
          print('PAGE',len(page))
          # inspect player-list JS function
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',page,re.I)
          for src in scripts:
            u=urllib.parse.urljoin(base,src)
            try: t=s.get(u,timeout=20).text
            except: continue
            for needle in ['GetPlayerList:', 'PlayerList"', 'PlayerList\'']:
              i=t.find(needle)
              if i>=0:
                print('\nSCRIPT',u,'NEEDLE',needle)
                print(t[max(0,i-1800):i+5000])
          # parse form defaults
          m=re.search(r'<form[^>]+id=["\']form1["\'][^>]*>([\s\S]*?)</form>',page,re.I)
          body=m.group(1) if m else ''
          pairs=[]
          for tag in re.findall(r'<input\b[^>]*>',body,re.I):
            nm=re.search(r'\bname=["\']([^"\']+)["\']',tag,re.I)
            if not nm: continue
            typ=(re.search(r'\btype=["\']([^"\']+)["\']',tag,re.I).group(1).lower() if re.search(r'\btype=["\']([^"\']+)["\']',tag,re.I) else 'text')
            if typ in ('checkbox','radio') and not re.search(r'\bchecked(?:\s*=|\s|>)',tag,re.I): continue
            val=re.search(r'\bvalue=["\']([^"\']*)["\']',tag,re.I)
            pairs.append((nm.group(1),h.unescape(val.group(1) if val else '')))
          override={'teamcolorid':'40417','strTeamColorName':'22-23 레알 마드리드','n1Strong':'1','n1Grow':'0'}
          names={k for k,v in pairs}
          pairs=[(k,override.get(k,v)) for k,v in pairs]
          for k,v in override.items():
            if k not in names: pairs.append((k,v))
          pairs.append(('n4PageNo','1'))
          print('\nFORM',urllib.parse.urlencode(pairs))
          for endpoint in ['/datacenter/PlayerList','/DataCenter/PlayerList']:
            r=s.post('https://fconline.nexon.com'+endpoint,data=pairs,headers={**headers,'X-Requested-With':'XMLHttpRequest','Referer':base},timeout=30)
            text=r.text
            print('\nENDPOINT',endpoint,'STATUS',r.status_code,'LEN',len(text))
            pats=[r'GetPlayerDetail\([^)]*\)',r'Strong(\d+)',r'data-no=["\'](\d{7,})["\']',r'spid[^0-9]{0,10}(\d{7,})']
            for pat in pats:
              vals=[]
              for x in re.finditer(pat,text,re.I):
                v=x.group(0)
                if v not in vals: vals.append(v)
              print('PAT',pat,'COUNT',len(vals),vals[:15])
            print(text[:12000])
          PY
