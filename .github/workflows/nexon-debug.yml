name: Nexon debug

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nexon-debug.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check live Nexon diagnostic endpoint
        run: |
          set -euxo pipefail
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/body.txt -w "%{http_code}" https://fc-help-chi.vercel.app/api/nexon-debug || true)
            echo "HTTP $code"
            cat /tmp/body.txt || true
            echo
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          exit 1
