name: One-time squad details

on:
  push:
    paths:
      - .github/workflows/one-time-squad-details.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/patch-squad-details.py
      - name: Commit changes
        run: |
          rm -f .github/workflows/one-time-squad-details.yml scripts/patch-squad-details.py
          git config user.name "susung5202"
          git config user.email "74191151+susung5202@users.noreply.github.com"
          git add components/SquadMaker.tsx .github/workflows/one-time-squad-details.yml scripts/patch-squad-details.py
          git commit -m "feat: add squad totals and player edit popup"
          git push
