name: Patch signup fields

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch signup form
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/login/page.tsx')
          s = p.read_text()

          s = s.replace(
            '  const [email, setEmail] = useState("");\n  const [password, setPassword] = useState("");',
            '  const [email, setEmail] = useState("");\n  const [fcNickname, setFcNickname] = useState("");\n  const [password, setPassword] = useState("");',
            1,
          )

          s = s.replace(
            '    const normalizedEmail = email.trim().toLowerCase();\n\n    if (!normalizedLoginId || !password || (mode === "signup" && !normalizedEmail)) {\n      setSuccess(false);\n      setMessage(mode === "signup" ? "로그인 아이디, 이메일, 비밀번호를 모두 입력해주세요." : "로그인 아이디와 비밀번호를 입력해주세요.");\n      return;\n    }',
            '    const normalizedEmail = email.trim().toLowerCase();\n    const normalizedFcNickname = fcNickname.trim();\n\n    if (!normalizedLoginId || !password) {\n      setSuccess(false);\n      setMessage("로그인 아이디와 비밀번호를 입력해주세요.");\n      return;\n    }\n\n    if (mode === "signup" && (!normalizedEmail || !normalizedFcNickname)) {\n      setSuccess(false);\n      setMessage("이메일, 로그인 아이디, FC Online 닉네임, 비밀번호를 모두 입력해주세요.");\n      return;\n    }',
            1,
          )

          s = s.replace(
            '      if (!LOGIN_ID_PATTERN.test(normalizedLoginId)) {\n        setMessage("로그인 아이디는 영문 소문자, 숫자, 밑줄(_)만 사용해 3~20자로 입력해주세요.");\n        setLoading(false);\n        return;\n      }\n\n      try {',
            '      if (!LOGIN_ID_PATTERN.test(normalizedLoginId)) {\n        setMessage("로그인 아이디는 영문 소문자, 숫자, 밑줄(_)만 사용해 3~20자로 입력해주세요.");\n        setLoading(false);\n        return;\n      }\n\n      if (normalizedFcNickname.length > 20) {\n        setMessage("FC Online 닉네임은 20자 이하로 입력해주세요.");\n        setLoading(false);\n        return;\n      }\n\n      try {',
            1,
          )

          s = s.replace(
            '          data: { login_id: normalizedLoginId },',
            '          data: {\n            login_id: normalizedLoginId,\n            display_name: normalizedFcNickname,\n            fconline_nickname: normalizedFcNickname,\n          },',
            1,
          )

          s = s.replace(
            ': "로그인에 사용할 아이디를 만들고 이메일 인증을 진행합니다. 로그인 아이디는 공개 프로필 닉네임과 별개입니다."}',
            ': "이메일, 로그인 아이디, FC Online 닉네임을 각각 따로 등록합니다."}',
            1,
          )

          marker = '''          <div>\n            <label htmlFor="password" className="text-sm text-gray-400">비밀번호</label>'''
          nickname_block = '''          {mode === "signup" && (\n            <div>\n              <label htmlFor="fcNickname" className="text-sm text-gray-400">FC Online 닉네임</label>\n              <input\n                id="fcNickname"\n                type="text"\n                value={fcNickname}\n                onChange={(e) => setFcNickname(e.target.value)}\n                placeholder="게임에서 사용하는 구단주 닉네임"\n                autoComplete="nickname"\n                maxLength={20}\n                required\n                className="mt-2 w-full rounded-xl border border-white/10 bg-[#0f1115] px-4 py-3 text-white outline-none transition focus:border-lime-400"\n              />\n              <p className="mt-1 text-[11px] text-gray-600">FC Help에서 표시되는 닉네임이자 FC Online 연동에 사용됩니다.</p>\n            </div>\n          )}\n\n'''
          if 'htmlFor="fcNickname"' not in s:
              if marker not in s:
                  raise SystemExit('password marker not found')
              s = s.replace(marker, nickname_block + marker, 1)

          p.write_text(s)
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/login/page.tsx
          git commit -m "separate login id and FC Online nickname"
          git push
