name: Apply validated squad share fix

on:
  push:
    paths:
      - .github/workflows/debug-squad-build.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply validated type guard fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/SquadMaker.tsx')
          s = p.read_text(encoding='utf-8')
          a = 'if (navigator.share && shareNavigator.canShare?.({ files: [file] }))'
          b = 'if (shareNavigator.canShare?.({ files: [file] }))'
          c = 'if (navigator.share && shareNavigator.canShare?.({ files: [imagePreview.file] }))'
          d = 'if (shareNavigator.canShare?.({ files: [imagePreview.file] }))'
          if a not in s or c not in s:
              raise SystemExit('share guards not found')
          p.write_text(s.replace(a, b, 1).replace(c, d, 1), encoding='utf-8')
          PY
      - name: Commit fix and cleanup
        run: |
          rm -f .github/workflows/debug-squad-build.yml
          git config user.name "susung5202"
          git config user.email "74191151+susung5202@users.noreply.github.com"
          git add components/SquadMaker.tsx .github/workflows/debug-squad-build.yml
          git commit -m "fix: make squad image share build-safe"
          git push
