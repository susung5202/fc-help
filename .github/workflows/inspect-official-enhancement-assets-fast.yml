name: Inspect official enhancement assets fast

on:
  push:
    paths:
      - .github/workflows/inspect-official-enhancement-assets-fast.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect player page
        shell: bash
        run: |
          set -euo pipefail
          URL='https://fconline.nexon.com/DataCenter/PlayerInfo?n1Strong=8&spid=840001625'
          curl --max-time 20 -L -A 'Mozilla/5.0' -sS "$URL" -o /tmp/page.html
          echo '=== strong/n1Strong contexts ==='
          grep -Ein -C 4 'n1Strong|strong|강화' /tmp/page.html | head -n 500 || true
          echo '=== all image refs near likely card markup ==='
          grep -Eio 'https?://[^"'"'"' <>]+\.(png|gif|webp)|/[^"'"'"' <>]+\.(png|gif|webp)' /tmp/page.html | sort -u | head -n 500 || true
          echo '=== CSS hrefs ==='
          grep -Eio 'href=["'"'][^"'"']+\.css[^"'"']*["'"']' /tmp/page.html | head -n 100 || true
