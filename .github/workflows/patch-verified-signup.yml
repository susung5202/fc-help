name: Patch verified signup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch login signup flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/login/page.tsx')
          s = p.read_text()

          pattern = re.compile(
              r'''      const \{ data, error \} = await supabase\.auth\.signUp\(\{.*?      setLoading\(false\);\n      return;\n    \}\n\n    try \{\n      const response = await fetch\("/api/auth/login",''',
              re.S,
          )

          replacement = '''      try {\n        const signupResponse = await fetch("/api/auth/signup", {\n          method: "POST",\n          headers: { "Content-Type": "application/json" },\n          body: JSON.stringify({\n            email: normalizedEmail,\n            loginId: normalizedLoginId,\n            fcNickname: normalizedFcNickname,\n            password,\n          }),\n        });\n        const signupPayload = (await signupResponse.json()) as {\n          nickname?: string;\n          ouid?: string;\n          emailConfirmationRequired?: boolean;\n          access_token?: string | null;\n          refresh_token?: string | null;\n          error?: string;\n        };\n\n        if (!signupResponse.ok) {\n          setMessage(signupPayload.error || "회원가입에 실패했습니다.");\n          setLoading(false);\n          return;\n        }\n\n        if (signupPayload.access_token && signupPayload.refresh_token) {\n          const { error: sessionError } = await supabase.auth.setSession({\n            access_token: signupPayload.access_token,\n            refresh_token: signupPayload.refresh_token,\n          });\n          if (sessionError) {\n            setMessage(authErrorMessage(sessionError.message, mode));\n            setLoading(false);\n            return;\n          }\n\n          router.push("/mypage");\n          router.refresh();\n          return;\n        }\n\n        setSuccess(true);\n        setMessage(`FC Online '${signupPayload.nickname ?? normalizedFcNickname}' 구단주를 확인했습니다. 이메일 인증 후 로그인해주세요.`);\n        setMode("login");\n        setPassword("");\n        setFcNickname("");\n        setLoading(false);\n        return;\n      } catch {\n        setMessage("회원가입 처리 중 오류가 발생했습니다.");\n        setLoading(false);\n        return;\n      }\n    }\n\n    try {\n      const response = await fetch("/api/auth/login",'''

          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'signup block patch count={count}')

          s2 = s2.replace(
              '? "아이디 또는 이메일과 비밀번호를 입력해주세요."',
              '? "아이디 또는 이메일과 비밀번호를 입력해주세요."',
          )

          p.write_text(s2)
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/login/page.tsx
          git commit -m "verify FC Online nickname before signup"
          git push
