name: inspect-playerstat
on:
  push:
    paths:
      - '.github/workflows/inspect-playerstat.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect FC Online PlayerStat filter markup
        run: |
          python - <<'PY'
          import requests,re
          u='https://fconline.nexon.com/DataCenter/PlayerStat'
          r=requests.get(u,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ko-KR,ko;q=0.9'},timeout=30)
          print('STATUS',r.status_code,'LEN',len(r.text))
          html=r.text
          for pat in [r'name=["\'][^"\']*[Tt]eam[^"\']*["\']', r'id=["\'][^"\']*[Tt]eam[^"\']*["\']', r'str[^"\'\s<>]*Team[^"\'\s<>]*', r'teamcolor[^"\'\s<>]*']:
            print('PATTERN',pat)
            vals=[]
            for m in re.finditer(pat,html,re.I):
              v=m.group(0)
              if v not in vals: vals.append(v)
            print('\n'.join(vals[:100]))
          for needle in ['팀컬러명을 입력해주세요','22-23 레알 마드리드']:
            i=html.find(needle)
            print('\nNEEDLE',needle,'INDEX',i)
            if i>=0: print(html[max(0,i-2500):i+3500])
          PY
