name: Inspect official enhancement assets

on:
  push:
    paths:
      - .github/workflows/inspect-enhancement-assets.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect FC Online player page and styles
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.parse

          UA = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'}
          page_url = 'https://fconline.nexon.com/DataCenter/PlayerInfo?n1Strong=8&spid=845226271'

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.read().decode('utf-8', 'ignore')

          html = get(page_url)
          print('PAGE', len(html), page_url)
          print('\n=== PAGE SNIPPETS ===')
          for pat in ['n1Strong', 'strong', 'rank', '강화']:
              print('\nPATTERN', pat)
              for m in list(re.finditer(pat, html, re.I))[:8]:
                  print(re.sub(r'\s+', ' ', html[max(0,m.start()-250):m.end()+450]))

          css_urls = []
          for href in re.findall(r'<link[^>]+href=["\']([^"\']+\.css(?:\?[^"\']*)?)["\']', html, re.I):
              url = urllib.parse.urljoin(page_url, href)
              if url not in css_urls:
                  css_urls.append(url)
          print('\nCSS COUNT', len(css_urls))

          for url in css_urls:
              try:
                  css = get(url)
              except Exception as e:
                  print('CSS FAIL', url, e)
                  continue
              if not re.search(r'strong|rank|reinfor|enhance|grade', css, re.I):
                  continue
              print('\n=== CSS', url, '===')
              for m in list(re.finditer(r'strong|rank|reinfor|enhance|grade', css, re.I))[:80]:
                  snippet = css[max(0,m.start()-250):m.end()+500]
                  print(re.sub(r'\s+', ' ', snippet))

          print('\n=== PLAYER ABILITY POST ===')
          data = urllib.parse.urlencode({
              'spid': '845226271',
              'n1Strong': '8',
              'n1Grow': '4',
              'n4TeamColorId': '0',
              'n4TeamColorLv': '0',
              'n1Change': '0',
              'strPlayerImg': 'https://fo4.dn.nexoncdn.co.kr/live/externalAssets/common/playersAction/p845226271.png',
              'rd': '0',
          }).encode()
          headers = dict(UA)
          headers.update({
              'Referer': page_url,
              'X-Requested-With': 'XMLHttpRequest',
              'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
          })
          req = urllib.request.Request('https://fconline.nexon.com/datacenter/PlayerAbility', data=data, headers=headers)
          with urllib.request.urlopen(req, timeout=25) as r:
              ability = r.read().decode('utf-8', 'ignore')
          print('ABILITY', len(ability))
          for pat in ['n1Strong', 'strong', 'rank', '강화']:
              print('\nABILITY PATTERN', pat)
              for m in list(re.finditer(pat, ability, re.I))[:15]:
                  print(re.sub(r'\s+', ' ', ability[max(0,m.start()-300):m.end()+600]))
          PY
