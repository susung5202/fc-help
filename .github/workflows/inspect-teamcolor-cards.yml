name: inspect-teamcolor-cards
on:
  push:
    paths:
      - '.github/workflows/inspect-teamcolor-cards.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official teamcolor card list
        run: |
          python - <<'PY'
          import requests,re
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'ko-KR,ko;q=0.9','X-Requested-With':'XMLHttpRequest','Referer':'https://fconline.nexon.com/DataCenter','Origin':'https://fconline.nexon.com'})
          base={
            'n8PlayerGrade1Min':'','n8PlayerGrade1Max':'','n1Confederation':'0','n4LeagueId':'0','strSeason':'','strPosition':'','strPhysical':'','preferredfoot':'0','n1FootAblity':'0','n1SkillMove':'0','n1InterationalRep':'0','n4BirthMonth':'0','n4BirthDay':'0','n4TeamId':'0','n4NationId':'0','strAbility1':'','strAbility2':'','strAbility3':'','strTrait1':'','strTrait2':'','strTrait3':'','strTraitNon1':'','strTraitNon2':'','strTraitNon3':'','n1Strong':'1','n1Grow':'0','n1TeamColor':'0','strSkill1':'sprintspeed','strSkill2':'acceleration','strSkill3':'strength','strSkill4':'stamina','strSearchStatus':'off','strOrderby':'','strTeamColorCategory':'','n1History':'0','n4PlayYear':'0','strPlayerName':'','strTeamName':'','strNationName':'','n4OvrMin':'','n4OvrMax':'','n4SalaryMin':'','n4SalaryMax':'','n1Ability1Min':'','n1Ability1Max':'','n1Ability2Min':'','n1Ability2Max':'','n1Ability3Min':'','n1Ability3Max':'','n4BirthYearMin':'','n4BirthYearMax':'','n4HeightMin':'','n4HeightMax':'','n4WeightMin':'','n4WeightMax':'','n4AvgPointMin':'','n4AvgPointMax':''}
          for tc,name in [(2002,'프랑스'),(2008,'벨기에'),(40417,'22-23 레알 마드리드')]:
            for summary in ['1','0']:
              for page in [1,2]:
                d=dict(base); d.update({'teamcolorid':str(tc),'strTeamColorName':name,'IsSummaryPlayer':summary,'n4PageNo':str(page)})
                r=s.post('https://fconline.nexon.com/datacenter/PlayerList',data=d,timeout=30)
                ids=re.findall(r'area_playerunit_(\d+)',r.text)
                print(name,'summary',summary,'page',page,'status',r.status_code,'count',len(ids),'first',ids[:5],'last',ids[-5:])
          PY
