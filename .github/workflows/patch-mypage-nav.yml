name: Patch mypage navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch mypage pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def add_import(path, after, line):
              p = Path(path)
              s = p.read_text()
              if line not in s:
                  if after not in s:
                      raise SystemExit(f'import anchor missing: {path}')
                  s = s.replace(after, after + line, 1)
                  p.write_text(s)

          add_import('app/mypage/page.tsx', 'import PlayerArtwork from "@/components/PlayerArtwork";\n', 'import MyPageNav from "@/components/MyPageNav";\n')
          add_import('app/mypage/activity/page.tsx', 'import { useRouter } from "next/navigation";\n', 'import MyPageNav from "@/components/MyPageNav";\n')
          add_import('app/mypage/reports/page.tsx', 'import { useRouter } from "next/navigation";\n', 'import MyPageNav from "@/components/MyPageNav";\n')
          add_import('app/mypage/settings/page.tsx', 'import { useRouter } from "next/navigation";\n', 'import MyPageNav from "@/components/MyPageNav";\n')

          # Main profile page: menu before profile content.
          p = Path('app/mypage/page.tsx')
          s = p.read_text()
          marker = '      <div className="mx-auto w-full max-w-5xl px-4 py-6 sm:px-6 sm:py-10">\n        <section className="border-b border-white/10 pb-7 sm:pb-9">'
          replacement = '      <div className="mx-auto w-full max-w-5xl px-4 py-6 sm:px-6 sm:py-10">\n        <MyPageNav />\n\n        <section className="mt-6 border-b border-white/10 pb-7 sm:mt-8 sm:pb-9">'
          if '<MyPageNav />' not in s:
              if marker not in s:
                  raise SystemExit('mypage render anchor missing')
              s = s.replace(marker, replacement, 1)
          p.write_text(s)

          def patch_subpage(path, header_end):
              p = Path(path)
              s = p.read_text()
              # Remove standalone back-to-mypage button from header now that the shared nav exists.
              s = s.replace(header_end, '        </div>\n\n        <div className="mt-6">\n          <MyPageNav />\n        </div>', 1)
              p.write_text(s)

          patch_subpage(
              'app/mypage/activity/page.tsx',
              '          <Link href="/mypage" className="rounded-xl border border-white/10 px-4 py-2.5 text-xs font-black text-gray-300 hover:bg-white/5">\n            ← 마이페이지\n          </Link>\n        </div>'
          )
          patch_subpage(
              'app/mypage/reports/page.tsx',
              '          <Link href="/mypage" className="rounded-xl border border-white/10 px-3 py-2 text-xs font-bold text-gray-300 hover:bg-white/5">← 마이페이지</Link>\n        </div>'
          )
          patch_subpage(
              'app/mypage/settings/page.tsx',
              '          <Link href="/mypage" className="rounded-xl border border-white/10 px-4 py-2.5 text-xs font-black text-gray-300 hover:bg-white/5">\n            ← 마이페이지\n          </Link>\n        </div>'
          )

          # Remove Link imports where the subpage no longer uses Link elsewhere.
          for path in ['app/mypage/reports/page.tsx', 'app/mypage/settings/page.tsx']:
              p = Path(path)
              s = p.read_text()
              if '<Link ' not in s and 'Link<' not in s:
                  s = s.replace('import Link from "next/link";\n', '')
              p.write_text(s)
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/mypage components/MyPageNav.tsx
          git commit -m "unify mypage navigation"
          git push
