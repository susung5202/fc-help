name: Patch profile identities

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch squad author and comment identities
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          # Squad feed card: author avatar/profile and hide redundant detail actions in detail view.
          path = Path("components/SquadFeedCard.tsx")
          text = path.read_text()
          if 'detailMode = false' not in text:
              text = replace_once(
                  text,
                  'import { useEffect, useState } from "react";',
                  'import { useEffect, useMemo, useState } from "react";',
                  'feed react import',
              )
              text = replace_once(
                  text,
                  'import { useRouter } from "next/navigation";\nimport PlayerArtwork from "@/components/PlayerArtwork";',
                  'import { useRouter } from "next/navigation";\nimport PlayerArtwork from "@/components/PlayerArtwork";\nimport { createClient } from "@/lib/supabase/client";',
                  'feed supabase import',
              )
              text = replace_once(
                  text,
                  'type FeedPlayerDetail = {\n  prices: Array<string | null>;\n};',
                  'type FeedPlayerDetail = {\n  prices: Array<string | null>;\n};\n\ntype AuthorProfile = {\n  username: string | null;\n  avatar_url: string | null;\n};',
                  'author profile type',
              )
              text = replace_once(
                  text,
                  'export default function SquadFeedCard({ post }: { post: SquadFeedPost }) {\n  const router = useRouter();',
                  'export default function SquadFeedCard({ post, detailMode = false }: { post: SquadFeedPost; detailMode?: boolean }) {\n  const router = useRouter();\n  const supabase = useMemo(() => createClient(), []);\n  const [authorProfile, setAuthorProfile] = useState<AuthorProfile | null>(null);',
                  'feed signature',
              )
              anchor = '''  function copySquad() {\n    window.localStorage.setItem("fc-help-squad-v1", JSON.stringify(post.squad_data));\n    router.push("/squad");\n  }'''
              insert = '''  useEffect(() => {\n    const authorId = post.author_id;\n    if (!authorId) {\n      setAuthorProfile(null);\n      return;\n    }\n\n    let active = true;\n    void supabase\n      .from("profiles")\n      .select("username,avatar_url")\n      .eq("id", authorId)\n      .maybeSingle()\n      .then(({ data }) => {\n        if (active) setAuthorProfile((data as AuthorProfile | null) ?? null);\n      });\n\n    return () => {\n      active = false;\n    };\n  }, [post.author_id, supabase]);\n\n  function copySquad() {\n    window.localStorage.setItem("fc-help-squad-v1", JSON.stringify(post.squad_data));\n    router.push("/squad");\n  }'''
              text = replace_once(text, anchor, insert, 'author profile effect')

              old_author = '''            {post.author_id ? (\n              <Link href={`/profile/${post.author_id}`} className="font-bold text-gray-300 transition hover:text-lime-300">\n                {post.author_name}\n              </Link>\n            ) : (\n              <span className="font-bold text-gray-300">{post.author_name}</span>\n            )}'''
              new_author = '''            {post.author_id ? (\n              <Link href={`/profile/${post.author_id}`} className="inline-flex items-center gap-1.5 font-bold text-gray-300 transition hover:text-lime-300">\n                <span className="flex h-5 w-5 shrink-0 items-center justify-center overflow-hidden rounded-full border border-white/10 bg-[#242a27] text-[9px] font-black text-lime-200">\n                  {authorProfile?.avatar_url ? (\n                    <img src={authorProfile.avatar_url} alt="" className="h-full w-full object-cover" />\n                  ) : (\n                    post.author_name.trim().slice(0, 1).toUpperCase()\n                  )}\n                </span>\n                <span>{post.author_name}</span>\n                {authorProfile?.username && <span className="font-medium text-gray-600">@{authorProfile.username}</span>}\n              </Link>\n            ) : (\n              <span className="font-bold text-gray-300">{post.author_name}</span>\n            )}'''
              text = replace_once(text, old_author, new_author, 'author identity')

              old_top = '''          <Link href={`/squad/gallery/${post.id}`} className="rounded-xl border border-white/10 bg-white/[0.03] px-3.5 py-2.5 text-xs font-black text-gray-200 transition hover:bg-white/[0.07] hover:text-white">\n            자세히\n          </Link>'''
              new_top = '''          {!detailMode && (\n            <Link href={`/squad/gallery/${post.id}`} className="rounded-xl border border-white/10 bg-white/[0.03] px-3.5 py-2.5 text-xs font-black text-gray-200 transition hover:bg-white/[0.07] hover:text-white">\n              자세히\n            </Link>\n          )}'''
              text = replace_once(text, old_top, new_top, 'top detail action')

              old_bottom = '''            <Link href={`/squad/gallery/${post.id}`} className="ml-auto rounded-lg bg-lime-300 px-3 py-2 font-black text-black transition hover:bg-lime-200">자세히 보기</Link>'''
              new_bottom = '''            {!detailMode && (\n              <Link href={`/squad/gallery/${post.id}`} className="ml-auto rounded-lg bg-lime-300 px-3 py-2 font-black text-black transition hover:bg-lime-200">자세히 보기</Link>\n            )}'''
              text = replace_once(text, old_bottom, new_bottom, 'bottom detail action')
              path.write_text(text)

          # Detail page: mark feed card as detail mode and enrich comments with profile identities.
          path = Path("components/SquadGalleryDetail.tsx")
          text = path.read_text()
          if 'commentProfiles' not in text:
              text = replace_once(
                  text,
                  'type PlayerDetail = {\n  salary: number | null;\n  prices: Array<string | null>;\n  positionOvr: number | null;\n  failed?: boolean;\n};',
                  'type PlayerDetail = {\n  salary: number | null;\n  prices: Array<string | null>;\n  positionOvr: number | null;\n  failed?: boolean;\n};\n\ntype CommentProfile = {\n  id: string;\n  username: string | null;\n  avatar_url: string | null;\n};',
                  'comment profile type',
              )
              text = replace_once(
                  text,
                  '  const [comments, setComments] = useState<Comment[]>([]);\n  const [userId, setUserId] = useState<string | null>(null);',
                  '  const [comments, setComments] = useState<Comment[]>([]);\n  const [commentProfiles, setCommentProfiles] = useState<Record<string, CommentProfile>>({});\n  const [userId, setUserId] = useState<string | null>(null);',
                  'comment profile state',
              )
              old_set_comments = '    setComments((commentData ?? []) as Comment[]);'
              new_set_comments = '''    const loadedComments = (commentData ?? []) as Comment[];\n    setComments(loadedComments);\n\n    const commentUserIds = Array.from(new Set(loadedComments.map((comment) => comment.user_id).filter(Boolean)));\n    if (commentUserIds.length > 0) {\n      const { data: profileRows } = await supabase\n        .from("profiles")\n        .select("id,username,avatar_url")\n        .in("id", commentUserIds);\n      const profileMap = Object.fromEntries(\n        ((profileRows ?? []) as CommentProfile[]).map((profile) => [profile.id, profile])\n      );\n      setCommentProfiles(profileMap);\n    } else {\n      setCommentProfiles({});\n    }'''
              text = replace_once(text, old_set_comments, new_set_comments, 'comment profiles load')
              text = replace_once(text, '<SquadFeedCard post={post} />', '<SquadFeedCard post={post} detailMode />', 'detail mode prop')

              old_comments = '''          {topLevel.map((comment) => <div key={comment.id} className="rounded-xl border border-white/[0.08] bg-black/10 p-3.5"><div className="flex items-center justify-between gap-3"><span className="text-xs font-black text-gray-200">{comment.author_name}</span><span className="text-[10px] text-gray-600">{new Date(comment.created_at).toLocaleString("ko-KR")}</span></div><p className="mt-2 whitespace-pre-wrap text-sm leading-6 text-gray-300">{comment.content}</p><div className="mt-2 text-[10px] font-bold text-gray-600">좋아요 {comment.likes_count}</div></div>)}'''
              new_comments = '''          {topLevel.map((comment) => {\n            const commentProfile = commentProfiles[comment.user_id];\n            const initial = comment.author_name.trim().slice(0, 1).toUpperCase();\n            return (\n              <div key={comment.id} className="rounded-xl border border-white/[0.08] bg-black/10 p-3.5">\n                <div className="flex items-center justify-between gap-3">\n                  <Link href={`/profile/${comment.user_id}`} className="inline-flex min-w-0 items-center gap-2 transition hover:text-lime-300">\n                    <span className="flex h-8 w-8 shrink-0 items-center justify-center overflow-hidden rounded-full border border-white/10 bg-[#242a27] text-[10px] font-black text-lime-200">\n                      {commentProfile?.avatar_url ? (\n                        <img src={commentProfile.avatar_url} alt="" className="h-full w-full object-cover" />\n                      ) : (\n                        initial\n                      )}\n                    </span>\n                    <span className="min-w-0">\n                      <span className="block truncate text-xs font-black text-gray-200">{comment.author_name}</span>\n                      {commentProfile?.username && <span className="block truncate text-[10px] text-gray-600">@{commentProfile.username}</span>}\n                    </span>\n                  </Link>\n                  <span className="shrink-0 text-[10px] text-gray-600">{new Date(comment.created_at).toLocaleString("ko-KR")}</span>\n                </div>\n                <p className="mt-2 whitespace-pre-wrap text-sm leading-6 text-gray-300">{comment.content}</p>\n                <div className="mt-2 text-[10px] font-bold text-gray-600">좋아요 {comment.likes_count}</div>\n              </div>\n            );\n          })}'''
              text = replace_once(text, old_comments, new_comments, 'comment identity UI')
              path.write_text(text)

          print("profile identity UI patch applied")
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/SquadFeedCard.tsx components/SquadGalleryDetail.tsx
          git commit -m "show profile identities in squad community"
          git push origin HEAD:main
