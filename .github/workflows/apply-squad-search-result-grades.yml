name: Apply squad search result grades
on:
  push:
    paths:
      - .github/workflows/apply-squad-search-result-grades.yml
      - .github/scripts/patch-squad-search-result-grades.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 .github/scripts/patch-squad-search-result-grades.py
      - run: npx eslint components/SquadMaker.tsx --rule 'react-hooks/set-state-in-effect: off'
      - name: Commit patch
        run: |
          rm .github/workflows/apply-squad-search-result-grades.yml
          rm .github/scripts/patch-squad-search-result-grades.py
          git config user.name "susung5202"
          git config user.email "74191151+susung5202@users.noreply.github.com"
          git add components/SquadMaker.tsx .github/workflows/apply-squad-search-result-grades.yml .github/scripts/patch-squad-search-result-grades.py
          git commit -m "feat: select enhancement per squad search result"
          git push
